name: Save camera photo hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Capture frame
        run: |
          mkdir -p photos
          FILE="photos/$(date -u +%Y-%m-%d_%H-%M-%S).jpg"
          ffmpeg -y -hide_banner -loglevel error \
            -i "https://cam.a-telecom.ru/Sangary_Sever/tracks-v1/index.fmp4.m3u8" \
            -frames:v 1 -q:v 2 \
            "$FILE"

      - name: Commit photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photos
          git commit -m "Add camera photo $(date -u +%Y-%m-%d_%H-%M-%S)" || exit 0
          git push
