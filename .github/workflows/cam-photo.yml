name: Save camera photo hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Capture frame
        id: capture
        continue-on-error: true
        run: |
          set -x
          mkdir -p photos

          curl -L -sS \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36" \
            -e "https://www.a-telecom.ru/smotrite-ledohod-onlajn/" \
            -o playlist.m3u8 \
            "https://cam.a-telecom.ru/Sangary_Sever/tracks-v1/index.fmp4.m3u8"

          echo "----- PLAYLIST -----"
          cat playlist.m3u8

          FILE="photos/$(date -u +%Y-%m-%d_%H-%M-%S).jpg"

          ffmpeg -y \
            -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36" \
            -headers $'Referer: https://www.a-telecom.ru/smotrite-ledohod-onlajn/\r\nOrigin: https://www.a-telecom.ru\r\n' \
            -live_start_index -3 \
            -i "playlist.m3u8" \
            -frames:v 1 -q:v 2 \
            "$FILE"

          ls -lah photos || true

      - name: Commit photo
        if: steps.capture.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photos
          git diff --cached --quiet || git commit -m "Add camera photo $(date -u +%Y-%m-%d_%H-%M-%S)"
          git push
