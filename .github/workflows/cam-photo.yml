name: Save camera photo hourly

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Capture frame
        id: capture
        run: |
          set -x
          mkdir -p photos

          BASE="https://cam.a-telecom.ru/Sangary_Sever/tracks-v1/"
          PLAYLIST_URL="${BASE}index.fmp4.m3u8"

          curl -L -sS \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36" \
            -e "https://www.a-telecom.ru/smotrite-ledohod-onlajn/" \
            -o playlist.m3u8 \
            "$PLAYLIST_URL"

          echo "----- ORIGINAL PLAYLIST -----"
          cat playlist.m3u8

          python3 - <<'PY'
          from pathlib import Path
          import re

          base = "https://cam.a-telecom.ru/Sangary_Sever/tracks-v1/"
          text = Path("playlist.m3u8").read_text(encoding="utf-8")

          text = re.sub(
              r'(#EXT-X-MAP:URI=")([^/"][^"]*)(")',
              lambda m: m.group(1) + base + m.group(2) + m.group(3),
              text,
          )

          text = re.sub(
              r'^(seg-[^\r\n]+)$',
              lambda m: base + m.group(1),
              text,
              flags=re.MULTILINE,
          )

          Path("playlist_absolute.m3u8").write_text(text, encoding="utf-8")
          PY

          echo "----- ABSOLUTE PLAYLIST -----"
          cat playlist_absolute.m3u8

          FILE="photos/$(date -u +%Y-%m-%d_%H-%M-%S).jpg"

          timeout 90s ffmpeg -y -hide_banner \
            -protocol_whitelist "file,https,tcp,tls" \
            -extension_picky 0 \
            -live_start_index -3 \
            -i "playlist_absolute.m3u8" \
            -map 0:v:0 \
            -frames:v 1 \
            -q:v 2 \
            -update 1 \
            "$FILE"

          test -s "$FILE"
          ls -lh "$FILE"

      - name: Commit photo
        if: steps.capture.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photos
          git diff --cached --quiet || git commit -m "Add camera photo $(date -u +%Y-%m-%d_%H-%M-%S)"
          git push
